<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Margin">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F8F9FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1D23" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Margin Notebook</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: library drawer on the left, two-row tool strip, pages stacked on a desk like a paper notebook. */
:root{
  --desk:#E6E9EE; --chrome:#F8F9FB; --line:#D3D9E2; --fg:#1B2028; --muted:#5F6876;
  --accent:#2348C8; --accent-ink:#FFFFFF; --sel:#E2E8FA; --danger:#BF3328; --shadow:rgba(22,32,56,.14);
  --paper:#FFFFFF;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --ui:"Schibsted Grotesk", -apple-system, "Helvetica Neue", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#111317; --chrome:#1A1D23; --line:#2C3139; --fg:#E7EAEF; --muted:#959CA8;
  --accent:#8AA4FF; --accent-ink:#0D1222; --sel:#232D4A; --danger:#FF7D70; --shadow:rgba(0,0,0,.55); color-scheme:dark;}}
:root[data-theme="dark"]{
  --desk:#111317; --chrome:#1A1D23; --line:#2C3139; --fg:#E7EAEF; --muted:#959CA8;
  --accent:#8AA4FF; --accent-ink:#0D1222; --sel:#232D4A; --danger:#FF7D70; --shadow:rgba(0,0,0,.55); color-scheme:dark;}

html,body{height:100%}
body{background:var(--desk);color:var(--fg);font-family:var(--ui);font-size:15px;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}

#app{display:grid;grid-template-columns:288px minmax(0,1fr);height:100%}

/* Library */
#library{background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:30}
.lib-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 8px}
.brand{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.lib-search{padding:4px 16px 10px}
.lib-search input{width:100%;box-sizing:border-box;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--desk);color:var(--fg);padding:0 12px;font:inherit}
.new-btn{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px}
#noteList{flex:1;overflow:auto;padding:4px 8px 12px;display:flex;flex-direction:column;gap:2px}
.note-item{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:9px 8px;border-radius:10px}
.note-item:hover{background:var(--sel)}
.note-item[aria-current="true"]{background:var(--sel)}
.cover{width:34px;height:44px;border-radius:3px;background:var(--paper);box-shadow:0 0 0 1px var(--line) inset,0 1px 2px var(--shadow);position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;inset:8px 5px;background:repeating-linear-gradient(to bottom,transparent 0 5px,#C9D3E0 5px 6px)}
.cover.t-blank::after{display:none}
.cover.t-grid::after{background:linear-gradient(#C9D3E0 1px,transparent 1px) 0 0/5px 5px,linear-gradient(90deg,#C9D3E0 1px,transparent 1px) 0 0/5px 5px}
.cover.t-dots::after{background:radial-gradient(#AFBBCB 1px,transparent 1.2px) 0 0/5px 5px}
.cover.t-cornell::before{content:"";position:absolute;left:11px;top:6px;bottom:9px;width:1px;background:#9FB0C8;z-index:1}
.n-title{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.lib-empty{padding:18px 12px;color:var(--muted);font-size:14px;line-height:1.5}
.lib-foot{border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#2F9E6A;flex:none}
.dot.saving{background:#E0A321}
.dot.local{background:var(--muted)}
.dot.error{background:var(--danger)}
#scrim{display:none}

/* Editor */
#editor{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{background:var(--chrome);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 10px}
.bar1{height:52px}
.bar2{height:54px;justify-content:center;overflow-x:auto;scrollbar-width:none}
.bar2::-webkit-scrollbar{display:none}
.ib{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;flex:none;color:var(--fg)}
.ib:hover{background:var(--sel)}
.ib[disabled]{opacity:.35;pointer-events:none}
.ib[aria-pressed="true"]{background:var(--sel);color:var(--accent)}
#libBtn{display:none}
#title{flex:1;min-width:0;height:40px;border:0;background:transparent;color:var(--fg);font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.01em;padding:0 8px;border-radius:8px}
#title:focus{background:var(--desk);outline:none}
.pagecount{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;padding:0 6px;font-variant-numeric:tabular-nums}
.sep{width:1px;height:28px;background:var(--line);margin:0 6px;flex:none}
.swatch{width:40px;height:44px;display:grid;place-items:center;flex:none;border-radius:10px}
.swatch i{width:24px;height:24px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.12) inset;display:block}
.swatch[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--chrome),0 0 0 4px var(--fg)}
.swatch.custom{position:relative}
.swatch.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.swatch.custom i{background:conic-gradient(#e03131,#f59f00,#2f9e44,#1c7ed6,#7048e8,#e03131)}
.wbtn{width:36px;height:44px;display:grid;place-items:center;border-radius:10px;flex:none}
.wbtn i{display:block;border-radius:50%;background:var(--fg)}
.wbtn[aria-pressed="true"]{background:var(--sel)}
.wbtn[aria-pressed="true"] i{background:var(--accent)}

#scroller{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#pages{display:flex;flex-direction:column;align-items:center;gap:22px;padding:20px 16px 40vh;min-width:min-content;box-sizing:border-box}
.page{position:relative;background:var(--paper);border-radius:3px;box-shadow:0 1px 2px var(--shadow),0 10px 30px var(--shadow);flex:none}
.page canvas{display:block;width:100%;height:100%;border-radius:3px;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.finger .page canvas{touch-action:none}
.pnum{position:absolute;right:0;bottom:-18px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.texts{position:absolute;inset:0;pointer-events:none}
.tbox{position:absolute;pointer-events:none}
body.t-text .tbox{pointer-events:auto}
.tx{font-family:var(--ui);color:#1B1D22;outline:none;white-space:pre-wrap;word-break:break-word;min-height:1em;-webkit-user-select:text;user-select:text;caret-color:var(--accent)}
body.t-text .tx{box-shadow:0 0 0 1px rgba(35,72,200,.25);border-radius:2px}
body.t-text .tx:focus{box-shadow:0 0 0 2px #2348C8}
.grip{display:none;position:absolute;left:-26px;top:2px;width:22px;height:22px;border-radius:6px;background:#2348C8;color:#fff;touch-action:none;align-items:center;justify-content:center;font-size:12px}
body.t-text .grip{display:flex}
.example-tag{position:absolute;top:-14px;left:0;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}

#hover{position:fixed;pointer-events:none;border-radius:50%;border:1.5px solid #2348C8;transform:translate(-50%,-50%);z-index:50}

/* Sheet */
#sheetWrap{position:fixed;inset:0;z-index:60;background:rgba(10,14,22,.32);display:flex;align-items:flex-start;justify-content:flex-end;padding:calc(env(safe-area-inset-top,0px) + 56px) 12px 12px}
.sheet{background:var(--chrome);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px var(--shadow);width:min(380px,100%);max-height:100%;overflow:auto;padding:8px 0 10px}
.sheet h3{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 18px 6px}
.sheet .row{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px}
.chip{height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 18px;font-size:15px}
.mi:hover{background:var(--sel)}
.mi.danger{color:var(--danger)}
.mi small{margin-left:auto;color:var(--muted);font-size:12.5px}
.toggle{width:42px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;margin-left:auto}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:19px}
.confirm{padding:14px 18px 6px}
.confirm p{margin:0 0 14px;line-height:1.5}
.confirm .row{padding:0;justify-content:flex-end}
.btn{height:40px;padding:0 16px;border-radius:10px;font-weight:600}
.btn.ghost{border:1px solid var(--line)}
.btn.red{background:var(--danger);color:#fff}
.help{padding:4px 18px 8px;line-height:1.55;font-size:14.5px}
.help dt{font-weight:600;margin-top:10px}
.help dd{margin:2px 0 0;color:var(--muted)}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--fg);color:var(--chrome);padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;max-width:calc(100% - 32px);box-shadow:0 10px 30px var(--shadow)}

@media (max-width: 980px){
  #app{grid-template-columns:minmax(0,1fr)}
  #library{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);transform:translateX(-102%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}
  #app.lib-open #library{transform:none;box-shadow:0 0 60px var(--shadow)}
  #app.lib-open #scrim{display:block;position:fixed;inset:0;background:rgba(10,14,22,.3);z-index:25}
  #libBtn{display:grid}
}
@media (max-width: 520px){ .pagecount{display:none} .bar2{justify-content:flex-start} }
@media (prefers-reduced-motion: reduce){ #library,.toggle::after{transition:none} }
</style>

</head>
<body>
<div id="app">
  <aside id="library" aria-label="Notes library">
    <div class="lib-head">
      <div class="brand">Margin<span>.</span></div>
      <button class="new-btn" id="newBtn" aria-label="New note">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>New
      </button>
    </div>
    <div class="lib-search"><input id="search" type="search" placeholder="Search notes" autocomplete="off"></div>
    <div id="noteList"><div class="lib-empty">Opening your notes…</div></div>
    <div class="lib-foot"><span class="dot local" id="syncDot"></span><span id="syncText">Connecting…</span></div>
  </aside>
  <div id="scrim"></div>

  <main id="editor">
    <div class="bar bar1">
      <button class="ib" id="libBtn" aria-label="Show notes">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="16" height="14" rx="2.5"/><path d="M8.5 4v14"/></svg>
      </button>
      <input id="title" aria-label="Note title" value="Welcome to Margin" autocomplete="off" spellcheck="false">
      <span class="pagecount" id="pageCount">Page 1 of 1</span>
      <button class="ib" id="undoBtn" aria-label="Undo" disabled>
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5L4 9l4 4"/><path d="M4 9h9a5 5 0 010 10h-3"/></svg>
      </button>
      <button class="ib" id="redoBtn" aria-label="Redo" disabled>
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5l4 4-4 4"/><path d="M18 9H9a5 5 0 000 10h3"/></svg>
      </button>
      <button class="ib" id="moreBtn" aria-label="Page and note options">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor"><circle cx="5" cy="11" r="1.7"/><circle cx="11" cy="11" r="1.7"/><circle cx="17" cy="11" r="1.7"/></svg>
      </button>
    </div>
    <div class="bar bar2" id="toolbar">
      <button class="ib tool" data-tool="pen" aria-label="Pen (P)" aria-pressed="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M15.5 4.5l4 4L9 19l-5 1 1-5z"/><path d="M13.5 6.5l4 4"/></svg>
      </button>
      <button class="ib tool" data-tool="highlighter" aria-label="Highlighter (H)" aria-pressed="false">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M14 4l6 6-7 7-6-6z"/><path d="M7 11l-2 5 3 3 5-2"/><path d="M3 21h7"/></svg>
      </button>
      <button class="ib tool" data-tool="eraser" aria-label="Eraser (E)" aria-pressed="false">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M9 20h11"/><path d="M4.5 14.5L14 5l5 5-8.5 8.5a2 2 0 01-2.8 0L4.5 17.3a2 2 0 010-2.8z"/><path d="M8.5 10.5l5 5"/></svg>
      </button>
      <button class="ib tool" data-tool="text" aria-label="Text box (T)" aria-pressed="false">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6V4.5h14V6M12 4.5v15M9 19.5h6"/></svg>
      </button>
      <span class="sep"></span>
      <div id="swatches" style="display:flex"></div>
      <span class="sep"></span>
      <div id="widths" style="display:flex"></div>
    </div>
    <div id="scroller"><div id="pages"></div></div>
  </main>
</div>
<div id="hover" hidden></div>
<div id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>

<script>
(() => {
const W = 1000, H = 1414;             // logical page: A4 portrait, 1 unit = 0.21 mm
const RULE0 = 174, RULE = 34;          // ruled lines (8 mm college-ish rule)
const MM5 = W / 210 * 5;               // 5 mm grid
const INK = '#1B1D22';
const INKS = {
  pen: ['#1B1D22', '#2348C8', '#C9302C', '#1E8A57', '#7445C2'],
  highlighter: ['#FFD43B', '#FF8FC1', '#5FE3B8', '#74C0FC', '#FFA94D']
};
const WIDTHS = { pen: [1.3, 2.3, 3.8], highlighter: [14, 22, 32], eraser: [9, 18, 34] };
const TEMPLATES = [['blank','Blank'],['lined','Lined'],['grid','Grid'],['dots','Dots'],['cornell','Cornell']];
const PAPERS = [['ivory','Ivory','#FBF6EA'],['cream','Cream','#F7EDD4'],['butter','Butter','#F3E5BC'],['white','White','#FFFFFF']];
const STANDALONE = true;
const JSPDF_SRC = 'jspdf.umd.min.js';

const $ = s => document.querySelector(s);
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const app = $('#app'), scroller = $('#scroller'), pagesEl = $('#pages');

let prefs = {};
try { prefs = JSON.parse(localStorage.getItem('margin.prefs') || '{}'); } catch (e) {}
const state = {
  tool: 'pen',
  color: { pen: prefs.pen || INKS.pen[0], highlighter: prefs.hl || INKS.highlighter[0] },
  widthIdx: { pen: 1, highlighter: 1, eraser: 1 },
  fingerDraw: !!prefs.finger, zoom: 1,
  notes: new Map(), note: null, pages: [], undo: [], redo: [], query: ''
};
function savePrefs() {
  try { localStorage.setItem('margin.prefs', JSON.stringify({ pen: state.color.pen, hl: state.color.highlighter, finger: state.fingerDraw, tpl: prefs.tpl, paper: prefs.paper })); } catch (e) {}
}
function paperColor() { return (PAPERS.find(p => p[0] === prefs.paper) || PAPERS[1])[2]; }
function applyPaper() { document.documentElement.style.setProperty('--paper', paperColor()); }

/* ---------- Stroke encoding (delta, quantized) ---------- */
function enc(p) {
  const out = []; let px = 0, py = 0, pp = 0;
  for (let i = 0; i < p.length; i += 3) {
    const x = Math.round(p[i] * 4), y = Math.round(p[i + 1] * 4), q = Math.round(p[i + 2] * 63);
    out.push(x - px, y - py, q - pp); px = x; py = y; pp = q;
  }
  return out.join(',');
}
function dec(d) {
  const a = d ? d.split(',').map(Number) : []; const p = new Array(a.length);
  let x = 0, y = 0, q = 0;
  for (let i = 0; i + 2 < a.length; i += 3) { x += a[i]; y += a[i + 1]; q += a[i + 2]; p[i] = x / 4; p[i + 1] = y / 4; p[i + 2] = q / 63; }
  return p;
}
function bbox(s) {
  let a = 1e9, b = 1e9, c = -1e9, d = -1e9;
  for (let i = 0; i < s.pts.length; i += 3) { const x = s.pts[i], y = s.pts[i + 1]; if (x < a) a = x; if (y < b) b = y; if (x > c) c = x; if (y > d) d = y; }
  s.bb = [a, b, c, d]; return s;
}
const fromDoc = s => bbox({ t: s.t, c: s.c, w: s.w, pts: dec(s.d) });
const toDoc = s => ({ t: s.t, c: s.c, w: s.w, d: enc(s.pts) });

/* ---------- Drawing ---------- */
function drawTemplate(ctx, tpl) {
  ctx.save();
  const rule = '#C7D2E1';
  if (tpl === 'lined' || tpl === 'cornell') {
    ctx.strokeStyle = rule; ctx.lineWidth = 1.1;
    const bottom = tpl === 'cornell' ? H - 260 : H - 60;
    for (let y = RULE0; y <= bottom; y += RULE) { ctx.beginPath(); ctx.moveTo(tpl === 'cornell' ? 40 : 0, y); ctx.lineTo(tpl === 'cornell' ? W - 40 : W, y); ctx.stroke(); }
    if (tpl === 'lined') {
      ctx.strokeStyle = '#E7A9A4'; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(110, 0); ctx.lineTo(110, H); ctx.stroke();
    } else {
      ctx.strokeStyle = '#8FA3C0'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(40, 140); ctx.lineTo(W - 40, 140); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(300, 140); ctx.lineTo(300, H - 260); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(40, H - 260); ctx.lineTo(W - 40, H - 260); ctx.stroke();
      ctx.fillStyle = '#8FA3C0'; ctx.font = '500 15px "JetBrains Mono", monospace';
      ctx.fillText('DATE', 690, 118);
      ctx.fillText('CUES', 48, 162); ctx.fillText('NOTES', 308, 162);
      ctx.fillText('SUMMARY', 48, H - 236);
      ctx.strokeStyle = rule; ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.moveTo(740, 122); ctx.lineTo(W - 40, 122); ctx.stroke();
    }
  } else if (tpl === 'grid') {
    ctx.strokeStyle = '#D5DDE8'; ctx.lineWidth = 1;
    for (let x = MM5; x < W; x += MM5) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = MM5; y < H; y += MM5) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  } else if (tpl === 'dots') {
    ctx.fillStyle = '#AEBBCC';
    for (let x = MM5; x < W; x += MM5) for (let y = MM5; y < H; y += MM5) { ctx.beginPath(); ctx.arc(x, y, 1.7, 0, 6.283); ctx.fill(); }
  }
  ctx.restore();
}
function drawStroke(ctx, s) {
  const p = s.pts, n = p.length / 3;
  if (!n) return;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = s.c; ctx.fillStyle = s.c;
  if (s.t === 'h') {
    ctx.globalAlpha = .42; ctx.globalCompositeOperation = 'multiply'; ctx.lineWidth = s.w; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(p[0], p[1]);

/* ---------- Pencil input ---------- */
let live = null;
let base = document.createElement('canvas');
let lastPen = 0;
const hoverEl = $('#hover');

function canDraw(e) {

}
function toLogical(e, pg) {

}
function curWidth() { return WIDTHS[state.tool][state.widthIdx[state.tool]]; }
function pressureOf(e) {

function bindCanvas(pg) {

    const t = e.changedTouches[0];

    if (!canDraw(e) || live) return;
    e.preventDefault();

let liveRaf = 0;

function segDist2(px, py, ax, ay, bx, by) {

/* ---------- Undo / redo ---------- */
function pushUndo(a) { state.undo.push(a); if (state.undo.length > 200) state.undo.shift(); state.redo = []; updateUndo(); }

function applyAction(a, reverse) {

  } else if (a.k === 'erase') {
    if (reverse) [...a.items].sort((m, n) => m.i - n.i).forEach(({ s, i }) => pg.strokes.splice(Math.min(i, pg.strokes.length), 0, s));
    else a.items.forEach(({ s }) => { const i = pg.strokes.indexOf(s); if (i >= 0) pg.strokes.splice(i, 1); });
  } else if (a.k === 'clear') {

}

function redo() { const a = state.redo.pop(); if (!a) return; applyAction(a, false); state.undo.push(a); updateUndo(); }
$('#undoBtn').onclick = undo; $('#redoBtn').onclick = redo;

// Two-finger tap = undo, three-finger tap = redo
(() => {
  let g = null;
  scroller.addEventListener('touchstart', e => {
    if ([...e.touches].some(t => t.touchType === 'stylus')) { g = null; return; }
    if (!g) g = { t0: Date.now(), max: 0, start: new Map(), moved: false };
    g.max = Math.max(g.max, e.touches.length);
    for (const t of e.changedTouches) g.start.set(t.identifier, [t.clientX, t.clientY]);
  }, { passive: true });
  scroller.addEventListener('touchmove', e => {
    if (!g) return;
    for (const t of e.changedTouches) { const s = g.start.get(t.identifier); if (s && Math.hypot(t.clientX - s[0], t.clientY - s[1]) > 12) g.moved = true; }
  }, { passive: true });
  scroller.addEventListener('touchend', e => {
    if (!g || e.touches.length) return;
    const quick = Date.now() - g.t0 < 320;
    if (quick && !g.moved && document.activeElement?.className !== 'tx') {
      if (g.max === 2) { undo(); toast('Undo'); } else if (g.max === 3) { redo(); toast('Redo'); }
    }
    g = null;
  }, { passive: true });
  scroller.addEventListener('touchcancel', () => { g = null; }, { passive: true });
})();

function currentPageIndex() {

  let best = 0, bd = 1e9;
  state.pages.forEach((pg, i) => { const r = pg.el.getBoundingClientRect(); const d = mid < r.top ? r.top - mid : mid > r.bottom ? mid - r.bottom : 0; if (d < bd) { bd = d; best = i; } });

}

/* ---------- Page actions ---------- */

}
function deletePage(i) {

async function deleteNote() {

/* ---------- Export ---------- */
function renderForExport(pg, px) {

  const ctx = c.getContext('2d'); const k = px / W; ctx.setTransform(k, 0, 0, k, 0, 0);

}

async function saveFile(name, blob) {

    const d = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (!d) { toast('Saving files is not available in this view.'); return; }
    try { await d.save({ filename: name, data: blob }); } catch (e) { if (e.code !== 'declined') toast('Could not save the file.'); }
    return;
  }
  const file = new File([blob], name, { type: blob.type });

    try { await navigator.share({ files: [file] }); }
    catch (e) {

      else if (e.name !== 'AbortError') toast('Could not share the file.');
    }

  }

  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
function readySheet(file) {

  c.querySelector('p').textContent = file.name + ' is ready. Choose “Save to Files” to keep it on your iPad.';
  c.querySelector('.ghost').onclick = closeSheet;
  c.querySelectorAll('.btn')[1].onclick = () => { closeSheet(); navigator.share({ files: [file] }).catch(() => {}); };

}
async function exportPNG() {
  await document.fonts.ready;
  const i = currentPageIndex();
  const blob = await new Promise(r => renderForExport(state.pages[i], 2000).toBlob(r, 'image/png'));
  await saveFile(`${safeName(state.note.title)} p${i + 1}.png`, blob);
}
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function exportPDF() {
  toast('Preparing PDF…');
  try { if (!window.jspdf) await loadScript(JSPDF_SRC); }
  catch (e) { toast('Could not load the PDF maker. Check your connection.'); return; }
  await document.fonts.ready;
  const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', compress: true });
  state.pages.forEach((pg, i) => {
    if (i) doc.addPage('a4', 'portrait');
    doc.addImage(renderForExport(pg, 1600).toDataURL('image/jpeg', .9), 'JPEG', 0, 0, 210, 297);
  });
  await saveFile(safeName(state.note.title) + '.pdf', doc.output('blob'));
}

document.addEventListener('keydown', e => {
  const editing = e.target.closest && (e.target.closest('input') || e.target.isContentEditable);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !editing) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (e.key === 'Escape') { closeSheet(); app.classList.remove('lib-open'); if (editing) e.target.blur(); return; }
  if (editing || e.metaKey || e.ctrlKey || e.altKey) return;
  const map = { p: 'pen', h: 'highlighter', e: 'eraser', t: 'text' };
  if (map[e.key.toLowerCase()]) setTool(map[e.key.toLowerCase()]);
});

let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600); }

/* ---------- Start ---------- */
document.body.classList.toggle('finger', state.fingerDraw);
applyPaper();
setTool('pen');
openExample();
renderLibrary();
initStore().then(() => {
  if (!state.note.touched && state.note.example && state.notes.size) openFirst();
  renderLibrary();
});
document.fonts && document.fonts.ready.then(() => state.pages.forEach(requestRender));
})();
</script>

<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});</script>
